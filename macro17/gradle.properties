org.gradle.jvmargs=-Xmx2g
# shortcut: AGP 8.13 oficialmente vai até a API 36; silencia o aviso para compilar contra a 37. Remover ao subir para um AGP que suporte 37.
android.suppressUnsupportedCompileSdk=37
# O runtime do Kotlin vem de libs/ (vendorizado); sem isto o plugin baixaria o kotlin-stdlib do Maven Central.
kotlin.stdlib.default.dependency=false
